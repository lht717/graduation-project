<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Driving Cockpit · 自动驾驶虚仿实验舱</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg: #eef2f5;
            --surface: #ffffff;
            --surface-2: #f7f9fb;
            --ink: #142033;
            --muted: #697586;
            --line: #dfe5ec;
            --line-2: #edf1f5;
            --blue: #2f6fed;
            --blue-dark: #2459c7;
            --blue-soft: #edf4ff;
            --cyan: #27b6d8;
            --green: #20a464;
            --amber: #d88b16;
            --red: #d94a4a;
            --shadow: 0 10px 28px rgba(16, 31, 54, .055);
            --shadow-soft: 0 3px 12px rgba(16, 31, 54, .045);
            --radius: 18px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                Arial, sans-serif;
        }

        body { letter-spacing: .005em; }

        .topbar {
            height: 80px;                         /* 固定高度 */
            background: rgba(255,255,255,.92);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(14px);
            display: flex;                        /* 使用 flex 布局 */
            align-items: center;                  /* 垂直居中子元素 */
            padding: 0 15px;                      /* 左右留一点内边距，避免贴边 */
        }

        .topbar-inner {
            width: 100%;
            display: flex;
            align-items: center;                  /* 内部元素垂直居中 */
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            display: flex;
            align-items: center;                  /* Logo 和文字垂直居中 */
            min-width: 0;
            gap: 14px;
        }

        .brand-mark {
            width: 46px;                          /* 增大 Logo 尺寸 */
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: linear-gradient(145deg, #3c7df4, #275ed1);
            box-shadow: 0 8px 18px rgba(47,111,237,.22);
            flex: 0 0 auto;
            font-size: 1.4rem;                    /* 增大图标 */
        }

        .brand-main {
            margin: 0;
            font-size: 1.2rem;                    /* 增大主标题 */
            line-height: 1.2;
            font-weight: 760;
            white-space: nowrap;
        }

        .brand-sub {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.82rem;                   /* 增大副标题 */
            white-space: nowrap;
        }

        .connection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 700;
            color: var(--muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b8c1cd;
        }

        .connection.connected {
            color: #157347;
            background: #eefaf4;
            border-color: #c7ecd9;
        }

        .connection.connected .dot {
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(32,164,100,.10);
        }

        .page {
            padding: 24px 0 46px;
        }

        .cockpit-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(260px, .72fr);
            gap: 18px;
            align-items: stretch;
        }

        .hero-camera {
            min-height: 470px;
            border-radius: 22px;
            overflow: hidden;
            background: #11161d;
            box-shadow: var(--shadow);
            border: 1px solid #26303c;
            position: relative;
        }

        .hero-camera::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(0,0,0,.10), transparent 18%, transparent 74%, rgba(0,0,0,.30));
        }

        .hero-camera-head {
            position: absolute;
            top: 14px;
            left: 15px;
            right: 15px;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .camera-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 9px;
            background: rgba(15,20,28,.66);
            border: 1px solid rgba(255,255,255,.10);
            color: #fff;
            font-size: .76rem;
            font-weight: 750;
            backdrop-filter: blur(8px);
        }

        .camera-title small {
            color: #b9c4d1;
            font-size: .64rem;
            font-weight: 600;
        }

        .camera-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 9px;
            border-radius: 8px;
            background: rgba(15,20,28,.66);
            border: 1px solid rgba(255,255,255,.10);
            color: #e8eef5;
            font-size: .65rem;
            font-weight: 800;
            letter-spacing: .06em;
            backdrop-filter: blur(8px);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #50d690;
            box-shadow: 0 0 0 4px rgba(80,214,144,.08);
        }

        .hero-camera canvas {
            width: 100%;
            height: 100%;
            min-height: 470px;
            object-fit: cover;
            display: block;
        }

        .lane-guide {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 20%;
            transform: translateX(-50%);
            width: min(210px, 35%);
            height: 34%;
            border-left: 2px dashed rgba(87,205,232,.78);
            border-right: 2px dashed rgba(87,205,232,.78);
            clip-path: polygon(33% 100%, 67% 100%, 100% 0, 0 0);
            opacity: .65;
            pointer-events: none;
        }

        .center-marker {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 15%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(47,111,237,.33);
            pointer-events: none;
        }

        .hero-bottom {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 13px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 14px;
            color: #fff;
        }

        .drive-state {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 9px;
            background: rgba(15,20,28,.70);
            border: 1px solid rgba(255,255,255,.10);
            backdrop-filter: blur(8px);
        }

        .state-icon {
            width: 29px;
            height: 29px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: rgba(47,111,237,.88);
        }

        .state-main {
            font-size: .74rem;
            font-weight: 800;
        }

        .state-sub {
            margin-top: 2px;
            color: #b9c4d1;
            font-size: .61rem;
        }

        .hero-metrics {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 11px;
            border-radius: 9px;
            background: rgba(15,20,28,.70);
            border: 1px solid rgba(255,255,255,.10);
            backdrop-filter: blur(8px);
        }

        .hero-metric {
            text-align: right;
        }

        .hero-metric-label {
            color: #aeb9c7;
            font-size: .58rem;
            font-weight: 650;
        }

        .hero-metric-value {
            margin-top: 1px;
            font-size: .80rem;
            font-weight: 800;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-soft);
        }

        .panel-head {
            padding: 15px 16px;
            border-bottom: 1px solid var(--line-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: .83rem;
            font-weight: 770;
        }

        .panel-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            color: var(--blue);
            background: var(--blue-soft);
            font-size: .84rem;
        }

        .panel-tag {
            font-size: .62rem;
            color: var(--muted);
            font-weight: 700;
        }

        .controls {
            padding: 15px 16px 16px;
        }

        .select-label {
            margin-bottom: 7px;
            color: #475467;
            font-size: .67rem;
            font-weight: 750;
        }

        .form-select {
            min-height: 40px;
            border-color: var(--line);
            border-radius: 10px;
            color: var(--ink);
            font-size: .76rem;
            box-shadow: none;
            background-color: #fff;
        }

        .form-select:focus {
            border-color: #9dbaf7;
            box-shadow: 0 0 0 4px rgba(47,111,237,.10);
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 11px;
        }

        .sys-btn {
            min-height: 40px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-size: .72rem;
            font-weight: 760;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: .18s ease;
        }

        .sys-btn:hover:not(:disabled) { transform: translateY(-1px); }

        .primary-btn {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 5px 13px rgba(47,111,237,.16);
        }

        .primary-btn:hover:not(:disabled) {
            background: var(--blue-dark);
            color: #fff;
        }

        .secondary-btn {
            background: #fff;
            color: #425066;
            border-color: var(--line);
        }

        .secondary-btn:hover:not(:disabled) {
            background: #f7f9fb;
            color: var(--ink);
        }

        .danger-btn {
            background: #fff7f7;
            color: var(--red);
            border-color: #f4d2d2;
        }

        .danger-btn:hover:not(:disabled) {
            background: #fef0f0;
            color: #bd3636;
        }

        .sys-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        .mini-hint {
            display: flex;
            gap: 7px;
            margin-top: 11px;
            padding: 9px 10px;
            color: var(--muted);
            background: #f7f9fb;
            border-radius: 9px;
            font-size: .62rem;
            line-height: 1.45;
        }

        .mini-hint i {
            color: var(--blue);
            margin-top: 1px;
        }

        .rear-card {
            overflow: hidden;
        }

        .rear-camera-wrapper {
            padding: 10px;
        }

        .rear-camera-wrapper canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
            background: #11161d;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .footer {
            padding-top: 18px;
            color: #9aa5b3;
            text-align: center;
            font-size: .61rem;
        }

        @media (max-width: 1100px) {
            .cockpit-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 820px) {
            .hero-camera,
            .hero-camera canvas {
                min-height: 390px;
            }
        }

        @media (max-width: 620px) {
            .topbar {
                height: 66px;
            }

            .brand-sub { display: none; }
            .brand-main { font-size: .88rem; }

            .page { padding-top: 18px; }

            .hero-camera,
            .hero-camera canvas {
                min-height: 300px;
            }

            .hero-bottom {
                align-items: stretch;
                flex-direction: column;
            }

            .hero-metrics {
                justify-content: space-between;
            }

            .hero-metric { text-align: left; }
        }
    </style>
</head>

<body>
<header class="topbar">
    <div class="container">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark">
                    <i class="bi bi-car-front-fill"></i>
                </div>
                <div>
                    <h1 class="brand-main">人工智能工程技术 · 自动驾驶虚仿实验舱</h1>
                    <div class="brand-sub">AI Driving Cockpit · CARLA Simulation Platform</div>
                </div>
            </div>

            <div id="connectionPill" class="connection">
                <span id="connectionStatus" class="dot"></span>
                <span id="connectionText">未连接</span>
            </div>
        </div>
    </div>
</header>

<main class="container page">
    <!-- 主座舱区域 -->
    <section class="cockpit-grid">
        <div class="hero-camera">
            <div class="hero-camera-head">
                <div class="camera-title">
                    <i class="bi bi-camera-video-fill"></i>
                    前视道路
                    <small>ALGORITHM INPUT</small>
                </div>
                <div class="camera-live">
                    <span class="live-dot"></span>
                    LIVE
                </div>
            </div>

            <canvas id="frontCanvas" width="800" height="600"></canvas>

            <!-- 视觉辅助层 -->
            <div class="lane-guide"></div>
            <div class="center-marker"></div>

            <div class="hero-bottom">
                <div class="drive-state">
                    <div class="state-icon">
                        <i class="bi bi-robot"></i>
                    </div>
                    <div>
                        <div class="state-main" id="driveStateMain">待命</div>
                        <div class="state-sub" id="driveStateSub">等待车辆创建</div>
                    </div>
                </div>

                <div class="hero-metrics">
                    <div class="hero-metric">
                        <div class="hero-metric-label">速度</div>
                        <div class="hero-metric-value"><span id="heroSpeed">0</span> km/h</div>
                    </div>
                    <div class="hero-metric">
                        <div class="hero-metric-label">油门</div>
                        <div class="hero-metric-value"><span id="heroThrottle">0</span>%</div>
                    </div>
                    <div class="hero-metric">
                        <div class="hero-metric-label">朝向</div>
                        <div class="hero-metric-value"><span id="heroYaw">0</span>°</div>
                    </div>
                </div>
            </div>
        </div>

        <aside class="side-column">
            <!-- 后上方监控（小卡片） -->
            <section class="panel rear-card">
                <div class="panel-head">
                    <h3 class="panel-title">
                        <span class="panel-icon"><i class="bi bi-camera-reels"></i></span>
                        后上方监控
                    </h3>
                    <span class="panel-tag">REAR VIEW</span>
                </div>
                <div class="rear-camera-wrapper">
                    <canvas id="rearCanvas" width="800" height="600"></canvas>
                </div>
            </section>

            <!-- 驾驶控制 -->
            <section class="panel">
                <div class="panel-head">
                    <h3 class="panel-title">
                        <span class="panel-icon"><i class="bi bi-toggles"></i></span>
                        驾驶控制
                    </h3>
                    <span class="panel-tag">CONTROL</span>
                </div>

                <div class="controls">
                    <div class="select-label">车辆类型</div>
                    <select id="vehicleSelect" class="form-select" disabled>
                        <option>加载中...</option>
                    </select>

                    <div class="control-grid">
                        <button id="createBtn" class="sys-btn primary-btn">
                            <i class="bi bi-plus-lg"></i>
                            创建车辆
                        </button>
                        <button id="startBtn" class="sys-btn primary-btn" disabled>
                            <i class="bi bi-play-fill"></i>
                            开始行驶
                        </button>
                        <button id="stopBtn" class="sys-btn secondary-btn" disabled>
                            <i class="bi bi-pause-fill"></i>
                            停止行驶
                        </button>
                        <button id="destroyBtn" class="sys-btn danger-btn" disabled>
                            <i class="bi bi-trash3"></i>
                            销毁车辆
                        </button>
                    </div>

                    <div class="mini-hint">
                        <i class="bi bi-info-circle-fill"></i>
                        <span>创建车辆后启动自动驾驶流程，视觉窗口与车辆状态将同步更新。</span>
                    </div>
                </div>
            </section>
        </aside>
    </section>

    <div class="footer">
        AI Driving Cockpit · CARLA Simulation Platform
    </div>
</main>

<script>
    // ============================================================
    // WebSocket
    // ============================================================
    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    // DOM
    const frontCanvas = document.getElementById('frontCanvas');
    const rearCanvas = document.getElementById('rearCanvas');
    const frontCtx = frontCanvas.getContext('2d');
    const rearCtx = rearCanvas.getContext('2d');

    const frontImg = new Image();
    const rearImg = new Image();

    const vehicleSelect = document.getElementById('vehicleSelect');
    const createBtn = document.getElementById('createBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const destroyBtn = document.getElementById('destroyBtn');

    const connectionPill = document.getElementById('connectionPill');
    const connectionText = document.getElementById('connectionText');

    const driveStateMain = document.getElementById('driveStateMain');
    const driveStateSub = document.getElementById('driveStateSub');

    let vehicleCreated = false;
    let driving = false;

    function formatNumber(value, digits = 1) {
        const n = Number(value);
        return Number.isFinite(n) ? n.toFixed(digits) : '0';
    }

    function updateTelemetry(data = {}) {
        const speed = Number(data.speed ?? 0);
        const throttle = Number(data.throttle ?? 0);
        const yaw = Number(data.yaw ?? 0);

        document.getElementById('heroSpeed').textContent = formatNumber(speed, 0);
        document.getElementById('heroThrottle').textContent = formatNumber(throttle, 0);
        document.getElementById('heroYaw').textContent = formatNumber(yaw, 1);
    }

    function updateButtons() {
        createBtn.disabled = vehicleCreated || vehicleSelect.disabled;
        startBtn.disabled = !vehicleCreated || driving;
        stopBtn.disabled = !driving;
        destroyBtn.disabled = !vehicleCreated;
    }

    function setConnection(connected) {
        connectionPill.classList.toggle('connected', connected);
        connectionText.textContent = connected ? '已连接' : '未连接';
    }

    function updateDrivingState() {
        if (!vehicleCreated) {
            driveStateMain.textContent = '待命';
            driveStateSub.textContent = '等待车辆创建';
        } else if (driving) {
            driveStateMain.textContent = '自动驾驶';
            driveStateSub.textContent = '车辆正在运行';
        } else {
            driveStateMain.textContent = '车辆就绪';
            driveStateSub.textContent = '等待开始行驶';
        }
    }

    // WebSocket 事件
    ws.onopen = () => {
        setConnection(true);
        ws.send(JSON.stringify({ action: 'get_vehicle_blueprints' }));
    };

    ws.onclose = () => {
        setConnection(false);
    };

    ws.onerror = () => {
        setConnection(false);
    };

    ws.onmessage = (event) => {
        if (typeof event.data === 'string') {
            try {
                const msg = JSON.parse(event.data);

                if (msg.type === 'blueprints') {
                    vehicleSelect.innerHTML = '';
                    msg.data.forEach(bp => {
                        const option = document.createElement('option');
                        option.value = bp.id;
                        option.textContent = bp.name;
                        vehicleSelect.appendChild(option);
                    });
                    vehicleSelect.disabled = false;
                    updateButtons();
                }
                else if (msg.type === 'vehicle_created') {
                    vehicleCreated = true;
                    updateDrivingState();
                    updateButtons();
                    console.log('车辆创建成功，ID:', msg.vehicle_id);
                }
                else if (msg.type === 'status') {
                    // 处理车辆控制状态消息
                    if (msg.message === 'driving_started') {
                        driving = true;
                        updateDrivingState();
                        updateButtons();
                    } else if (msg.message === 'driving_stopped') {
                        driving = false;
                        updateDrivingState();
                        updateButtons();
                    } else if (msg.message === 'vehicle_destroyed') {
                        vehicleCreated = false;
                        driving = false;
                        updateDrivingState();
                        updateButtons();
                    }
                    // 处理仪表盘数据（如果存在）
                    if (msg.data) {
                        updateTelemetry(msg.data);
                    }
                }
                else if (msg.type === 'telemetry' || msg.type === 'vehicle_state') {
                    updateTelemetry(msg.data || msg);
                }
                else if (msg.type === 'error') {
                    alert('错误：' + msg.message);
                }
            } catch (error) {
                console.error('消息解析失败:', error);
            }
        }
        else if (event.data instanceof ArrayBuffer) {
            const data = new Uint8Array(event.data);
            if (data.length < 2) return;

            const prefix = data[0];
            const imageBytes = data.slice(1);
            const blob = new Blob([imageBytes], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);

            if (prefix === 0) {
                frontImg.onload = () => {
                    frontCtx.drawImage(frontImg, 0, 0, frontCanvas.width, frontCanvas.height);
                    URL.revokeObjectURL(url);
                };
                frontImg.onerror = () => URL.revokeObjectURL(url);
                frontImg.src = url;
            } else if (prefix === 1) {
                rearImg.onload = () => {
                    rearCtx.drawImage(rearImg, 0, 0, rearCanvas.width, rearCanvas.height);
                    URL.revokeObjectURL(url);
                };
                rearImg.onerror = () => URL.revokeObjectURL(url);
                rearImg.src = url;
            }
        }
    };

    // 按钮事件
    createBtn.onclick = () => {
        const selectedBlueprint = vehicleSelect.value;
        ws.send(JSON.stringify({ action: 'create_vehicle', blueprint_id: selectedBlueprint }));
    };

    startBtn.onclick = () => {
        ws.send(JSON.stringify({ action: 'start_driving' }));
    };

    stopBtn.onclick = () => {
        ws.send(JSON.stringify({ action: 'stop_driving' }));
    };

    destroyBtn.onclick = () => {
        ws.send(JSON.stringify({ action: 'destroy_vehicle' }));
    };

    // 初始状态
    updateTelemetry();
    updateDrivingState();
    updateButtons();
    setConnection(false);
